<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同一份內容，換一種風格</title>
<style>
* { box-sizing: border-box; }
body { margin: 24px; font-family: "Microsoft JhengHei", sans-serif; color: #243d46; background: #f5f2eb; line-height: 1.7; }
h1 { line-height: 1.3; } a { color: #17596e; }
.note { padding: 12px; background: #e5eeeb; }

/* 1. 練習 A：標題文字改為粉紫色 #CE7E9E，字號 30px */
h2 { color: #CE7E9E; font-size: 30px; }

/* 2. 練習 B：class 選取器，重點文字改為 #17596e */
.highlight { color: #17596e; font-weight: bold; }

/* 3. 練習 C：卡片背景套用 #F5F2EB，邊框 4px，圓角 20px，padding 32px，margin 40px 0 */
.card { 
  max-width: 560px; 
  background: #F5F2EB; 
  padding: 32px; 
  margin: 40px 0; 
  border: 4px solid #b9cfc5; 
  border-radius: 20px; 
  box-shadow: 0 3px 10px #00000012; 
}

/* 4. 內文好讀設定：font-size(18px)、line-height(1.8) */
.card p { font-size: 18px; line-height: 1.8; }

</style>
</head>
<body>
<h1>同一份內容，換一種風格</h1>
<p class="note">操作素材：請到 style 裡一次改一項，儲存並重新整理。HTML 內容先保留。</p>
<p><a href="05-color-lab-11517007.html">開啟色彩實驗室：選色、試色與複製色碼</a></p>
<article class="card">
  <h2>週末故事創作社</h2>
  <p>把生活中的小發現，變成一篇有角色、有情節的故事。歡迎喜歡畫畫、說故事或觀察生活的你。</p>
  <p class="highlight">本週任務：替故事角色設計一個小難題。</p>
</article>
<article class="card">
  <h2>我的學習目標</h2>
  <p>用清楚的文字介紹作品，讓第一次看到的人也能理解。</p>
</article>
</body>
</html>
