<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 第 1 點：網頁分頁名稱 -->
    <title>放學後社團體驗表</title>
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.6;
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
            color: #333;
        }
        form {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        fieldset {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            background: #fff;
        }
        legend {
            font-weight: bold;
            padding: 0 8px;
        }
        .option-label {
            display: block;
            font-weight: normal;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .reason-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        input[type="button"]:disabled {
            background-color: #ccc;
            color: #666;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 4px;
            cursor: not-allowed;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 第 1 點：整頁 h1 與練習版說明 -->
    <h1>放學後社團體驗表</h1>
    <p>這是介面練習，資料不會送出或保存，不能當成正式報名。</p>

    <form>
        <!-- 第 2 點：暱稱單行文字欄位 -->
        <div class="form-group">
            <label for="nickname">我的暱稱</label>
            <input type="text" id="nickname" name="nickname" placeholder="例如小星星">
        </div>

        <!-- 第 3 點：想體驗的社團下拉選單 -->
        <div class="form-group">
            <label for="club">想體驗的社團</label>
            <select id="club" name="club">
                <option value="">請選擇社團</option>
                <option value="story">故事劇場</option>
                <option value="science">科學手作</option>
                <option value="boardgame">桌遊挑戰</option>
            </select>
        </div>

        <!-- 第 4 & 5 點：方便參加的日子（單選按鈕 fieldset） -->
        <fieldset>
            <legend>方便參加的日子</legend>
            <label class="option-label">
                <input type="radio" id="day-tue" name="day" value="tuesday"> 星期二
            </label>
            <label class="option-label">
                <input type="radio" id="day-thu" name="day" value="thursday"> 星期四
            </label>
            <label class="option-label">
                <input type="radio" id="day-fri" name="day" value="friday"> 星期五
            </label>
        </fieldset>

        <!-- 第 5 點：期待的活動方式（複選方塊 fieldset） -->
        <fieldset>
            <legend>我期待的活動方式</legend>
            <label class="option-label">
                <input type="checkbox" id="act-craft" name="activity" value="craft"> 動手製作
            </label>
            <label class="option-label">
                <input type="checkbox" id="act-team" name="activity" value="teamwork"> 和同學合作
            </label>
            <label class="option-label">
                <input type="checkbox" id="act-share" name="activity" value="share"> 上台分享
            </label>
        </fieldset>

        <!-- 第 7 點：自行增加有用欄位（點心飲食習慣）與理由說明 -->
        <div class="form-group">
            <label for="diet">點心飲食習慣需求</label>
            <select id="diet" name="diet">
                <option value="none">無特殊需求 (葷食)</option>
                <option value="vegetarian">蛋奶素 / 全素</option>
                <option value="allergy">有食物過敏原限制</option>
            </select>
            <p class="reason-text">選擇此元件原因：社團活動常包含茶點時間，使用下拉選單能方便統整學生特殊的飲食習慣或過敏原，避免準備不合適的食物。</p>
        </div>

        <!-- 第 6 點：想告訴老師的事（5行高 textarea） -->
        <div class="form-group">
            <label for="teacher-note">想告訴老師的事</label>
            <textarea id="teacher-note" name="teacher_note" rows="5" placeholder="例如我想和同學一起完成一個小作品"></textarea>
        </div>

        <!-- 第 9 點：停用按鈕 -->
        <div class="form-group">
            <input type="button" value="練習版，尚未開放報名" disabled>
        </div>
    </form>

</body>
</html>
